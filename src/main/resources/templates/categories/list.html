<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Loại khóa học')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Loại khóa học</h3>
        <a class="btn btn-success" th:href="@{/categories/create}">+ Thêm loại khóa học</a>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(categories)}">Chưa có loại khóa học nào.</div>

    <table class="table table-bordered align-middle" th:unless="${#lists.isEmpty(categories)}">
        <thead class="table-light">
        <tr><th>#</th><th>Tên loại</th><th>Mô tả</th><th class="text-center">Số khóa học</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="c, st : ${categories}">
            <td th:text="${st.count}">1</td>
            <td th:text="${c.name}">Tên</td>
            <td th:text="${c.description}">Mô tả</td>
            <td class="text-center" th:text="${#lists.size(c.courses)}">0</td>
            <td class="text-nowrap">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/courses(categoryId=${c.id})}">Xem khóa học</a>
                <a class="btn btn-sm btn-outline-warning" th:href="@{/categories/{id}/edit(id=${c.id})}">Sửa</a>
                <form class="d-inline" method="post" th:action="@{/categories/{id}/delete(id=${c.id})}"
                      onsubmit="return confirm('Xóa loại khóa học này?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
