<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết khóa học')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <h3 th:text="${course.name}">Tên khóa học</h3>
                <div>
                    <span class="badge bg-success" th:if="${course.active}">Đang tuyển sinh</span>
                    <span class="badge bg-secondary" th:unless="${course.active}">Ngừng tuyển sinh</span>
                </div>
            </div>
            <dl class="row mb-0">
                <dt class="col-sm-3">Loại khóa học</dt>
                <dd class="col-sm-9" th:text="${course.category.name}"></dd>
                <dt class="col-sm-3">Học phí</dt>
                <dd class="col-sm-9" th:text="${#numbers.formatDecimal(course.tuitionFee, 1, 'POINT', 0, 'COMMA')} + ' VNĐ'"></dd>
                <dt class="col-sm-3">Thời lượng</dt>
                <dd class="col-sm-9">
                    <span th:text="${course.duration} + ' giờ'"></span>
                    <span class="badge ms-2" th:text="${course.durationType}"
                          th:classappend="${course.duration le 30} ? 'bg-info text-dark' : 'bg-primary'"></span>
                </dd>
                <dt class="col-sm-3">Mô tả</dt>
                <dd class="col-sm-9" th:text="${course.description != null} ? ${course.description} : '(chưa có mô tả)'"></dd>
            </dl>
        </div>
        <div class="card-footer d-flex gap-2">
            <a class="btn btn-warning btn-sm" th:href="@{/courses/{id}/edit(id=${course.id})}">Sửa</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/courses}">Về danh sách</a>
        </div>
    </div>

    <h4>Ảnh khóa học</h4>

    <!-- Thêm ảnh bằng URL -->
    <form method="post" th:action="@{/courses/{id}/images(id=${course.id})}" class="card card-body mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-7">
                <label class="form-label">Đường dẫn ảnh (URL)</label>
                <input type="text" name="imageUrl" class="form-control" placeholder="https://...">
            </div>
            <div class="col-md-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="thumbnail" value="true" id="thumbChk">
                    <label class="form-check-label" for="thumbChk">Đặt làm ảnh đại diện</label>
                </div>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Thêm ảnh</button>
            </div>
        </div>
    </form>

    <div class="alert alert-info" th:if="${#lists.isEmpty(course.images)}">
        Khóa học này chưa có ảnh.
    </div>

    <div class="row g-3 mb-5" th:unless="${#lists.isEmpty(course.images)}">
        <div class="col-md-4" th:each="img : ${course.images}">
            <div class="card h-100" th:classappend="${img.thumbnail} ? 'border-success border-2'">
                <img th:src="${img.imageUrl}" class="card-img-top" alt="Ảnh khóa học"
                     style="height:200px;object-fit:cover"
                     onerror="this.alt='Không tải được ảnh';this.style.background='#eee'">
                <div class="card-body">
                    <span class="badge bg-success mb-2" th:if="${img.thumbnail}">Ảnh đại diện</span>
                    <div class="small text-muted text-break mb-2" th:text="${img.imageUrl}"></div>
                    <div class="d-flex gap-2">
                        <form method="post" th:unless="${img.thumbnail}"
                              th:action="@{/courses/{cid}/images/{iid}/thumbnail(cid=${course.id},iid=${img.id})}">
                            <button type="submit" class="btn btn-sm btn-outline-success">Đặt làm ảnh đại diện</button>
                        </form>
                        <form method="post" onsubmit="return confirm('Xóa ảnh này?');"
                              th:action="@{/courses/{cid}/images/{iid}/delete(cid=${course.id},iid=${img.id})}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Xóa ảnh</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
