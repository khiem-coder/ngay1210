<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 720px;">
    <h3 class="mb-3" th:text="${title}">Thêm khóa học</h3>

    <form method="post" th:action="${formAction}" th:object="${form}" novalidate class="card card-body">
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            Dữ liệu chưa hợp lệ, vui lòng kiểm tra lại các trường bên dưới.
        </div>

        <div class="mb-3">
            <label class="form-label">Tên khóa học <span class="text-danger">*</span></label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Loại khóa học <span class="text-danger">*</span></label>
            <select th:field="*{courseCategoryId}" class="form-select"
                    th:classappend="${#fields.hasErrors('courseCategoryId')} ? 'is-invalid'">
                <option value="">-- Chọn loại khóa học --</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{courseCategoryId}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Học phí (VNĐ) <span class="text-danger">*</span></label>
                <input type="number" step="any" th:field="*{tuitionFee}" class="form-control"
                       th:classappend="${#fields.hasErrors('tuitionFee')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{tuitionFee}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Thời lượng (giờ) <span class="text-danger">*</span></label>
                <input type="number" th:field="*{duration}" class="form-control"
                       th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{duration}"></div>
            </div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{active}" class="form-check-input">
            <label class="form-check-label" th:for="${#ids.prev('active')}">Đang tuyển sinh</label>
        </div>

        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea th:field="*{description}" rows="3" class="form-control"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a class="btn btn-outline-secondary" th:href="@{/courses}">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
