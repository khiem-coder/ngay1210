spring.application.name=course-management
server.port=8080

# ====== KẾT NỐI SQL SERVER (sửa cho đúng máy của bạn) ======
# Dấu \\ (hai gạch chéo ngược) trước tên instance là BẮT BUỘC trong file .properties
spring.datasource.url=jdbc:sqlserver://LAPTOP-KR3PT9HU\\SQLEXPRESS;databaseName=CourseManagement;encrypt=true;trustServerCertificate=true
spring.datasource.username=course_app
spring.datasource.password=MatKhau@12345

# ====== CODE FIRST: Hibernate tạo/cập nhật bảng từ các entity khi ứng dụng khởi động ======
# update = tạo bảng nếu chưa có, bổ sung cột/ràng buộc còn thiếu (không xóa dữ liệu)
# Muốn xóa sạch rồi tạo lại bảng mỗi lần chạy: đổi thành create (dữ liệu mẫu sẽ nạp lại)
spring.jpa.hibernate.ddl-auto=update
# Giữ NGUYÊN tên bảng/cột như trong @Table/@Column (không tự đổi sang snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8

# Ghi log ra file app.log trong thư mục project
logging.file.name=app.log
